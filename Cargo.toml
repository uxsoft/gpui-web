[package]
name = "gpui_web"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "A Chromium (CEF) web view for GPUI, composited by the OS under the GPUI window"

[dependencies]
anyhow.workspace = true
futures.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Pinned: the presenters rely on GPUI behavior that is not API (Wayland
# surface alpha, the topmost DirectComposition target). Re-run the spikes in
# examples/ before bumping.
gpui = { package = "gpui-pre", version = "=0.3.8" }
raw-window-handle = "0.6"
async-channel = "2"
# One CEF (Chromium 154) on every platform. No sandbox in v1 (see README).
cef = { version = "=154.5.0", default-features = false, features = ["build-util"] }
# GPUI's image types, for the software presenter.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.17"
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-video = { version = "0.5.2", features = ["metal"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLTexture", "MTLCommandQueue", "MTLCommandBuffer", "MTLBlitCommandEncoder", "MTLCommandEncoder", "MTLResource", "MTLTypes", "objc2-io-surface"] }
objc2-io-surface = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
gpui-kit = "0.7"
tracing-subscriber.workspace = true
